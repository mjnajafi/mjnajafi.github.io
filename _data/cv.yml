    Projects:
      - name: Distributed Control of DC Microgrids
        summary: Developed voltage restoration algorithms with precise power sharing through pinning gain control, and event-triggered algorithms to reduce communication among renewable energy resources.
        highlights:
          - Implemented a hybrid control architecture combining continuous-time and discrete-time control.
          - Designed a supervisor mechanism for dynamic controller switching, optimizing performance and stability.
        start_date: 2021-01
        end_date: 2022-09

      - name: VSG Control of VSC-MTDC Systems
        summary: Designed a parameter-alternating virtual synchronous generator (VSG) controller for multi-terminal HVDC, damping low-frequency oscillations by adapting virtual inertia and damping parameters in real time.

      - name: Machine Learning Facial Recognition System
        summary: Developed ML models to classify facial expressions and attributes across demographics, implementing a custom three-layer CNN (ReLU, Adam optimizer) for robust feature extraction.
        start_date: 2024-12
        end_date: 2024-12
