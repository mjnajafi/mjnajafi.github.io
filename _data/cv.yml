  summary: Final-year Ph.D. candidate in Electrical & Computer Engineering with nearly a decade of experience spanning hands-on electrical installation, power systems, power electronics, and advanced control. Specializes in dynamic modeling and distributed control of AC/DC microgrids and inverter-based resources, turning rigorous theory (LMI optimization, stability analysis) into practical solutions that improve grid reliability. Proficient in MATLAB/Simulink, Python, Typhoon HIL, and PSCAD.

